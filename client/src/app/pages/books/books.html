<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h4 mb-0">
    <i class="fa-solid fa-book me-2"></i>
    Böcker
  </h1>

  <a class="btn btn-primary" routerLink="/books/new">
    <i class="fa-solid fa-plus me-2"></i>
    Lägg till ny bok
  </a>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Titel</th>
            <th>Författare</th>
            <th>Publiceringsdatum</th>
            <th class="text-end">Åtgärder</th>
          </tr>
        </thead>

        <tbody>
          @for (b of books(); track b.id) {
            <tr>
              <td>{{ b.title }}</td>
              <td>{{ b.author }}</td>
              <td>{{ b.publishedDate }}</td>
              <td class="text-end">
                <a
                  class="btn btn-sm btn-outline-secondary me-2"
                  [routerLink]="['/books', b.id, 'edit']"
                >
                  <i class="fa-solid fa-pen-to-square me-1"></i> Redigera
                </a>
                <button class="btn btn-sm btn-outline-danger" (click)="remove(b.id)">
                  <i class="fa-solid fa-trash me-1"></i> Radera
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center py-4 text-muted">
                Inga böcker ännu. Klicka på “Lägg till ny bok”.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
