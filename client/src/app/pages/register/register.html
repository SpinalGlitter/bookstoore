<h1 class="h4 mb-3"><i class="fa-solid fa-user-plus me-2"></i>Registrera</h1>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<div class="card">
  <div class="card-body">
    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-3">
        <label class="form-label">Användarnamn</label>
        <input class="form-control" name="username" [(ngModel)]="model.username" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Lösenord</label>
        <input
          class="form-control"
          type="password"
          name="password"
          [(ngModel)]="model.password"
          required
        />
      </div>

      <button class="btn btn-warning" [disabled]="f.invalid">
        <i class="fa-solid fa-user-plus me-2"></i>Skapa konto
      </button>

      <a class="btn btn-link" routerLink="/login">Har du redan konto? Logga in</a>
    </form>
  </div>
</div>
