<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h4 mb-0">
    <i class="fa-solid fa-quote-left me-2"></i>
    Mina citat
  </h1>

  <a class="btn btn-primary" routerLink="/quotes/new" [class.disabled]="!canAddMore()">
    <i class="fa-solid fa-plus me-2"></i>
    Lägg till citat
  </a>
</div>

@if (!canAddMore()) {
  <div class="alert alert-warning">
    Du kan max ha 5 citat. Ta bort ett citat för att kunna lägga till ett nytt.
  </div>
}

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Citat</th>
            <th>Författare</th>
            <th class="text-end">Åtgärder</th>
          </tr>
        </thead>

        <tbody>
          @for (q of quotes(); track q.id) {
            <tr>
              <td>{{ q.text }}</td>
              <td>{{ q.author }}</td>
              <td class="text-end">
                <a
                  class="btn btn-sm btn-outline-secondary me-2"
                  [routerLink]="['/quotes', q.id, 'edit']"
                >
                  <i class="fa-solid fa-pen-to-square me-1"></i> Redigera
                </a>
                <button class="btn btn-sm btn-outline-danger" (click)="remove(q.id)">
                  <i class="fa-solid fa-trash me-1"></i> Radera
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="text-center py-4 text-muted">Inga citat ännu.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
